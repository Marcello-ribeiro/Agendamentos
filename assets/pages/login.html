<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin </title>

    <link rel="shortcut icon" href="../assets/midia/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../css/loginadm.css">
</head>
<body>

    <main class="login-container">

        <div class="login-box">

            <p class="subtitulo">— ÁREA ADMINISTRATIVA —</p>

            <h1>
                Painel <span>Admin</span>
            </h1>

            <p class="descricao-login">
                Faça login para acessar os agendamentos.
            </p>

            <form id="loginForm">

                <div class="campo-login">
                    <label>E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Seu e-mail"
                        required
                    >
                </div>

                <div class="campo-login">
                    <label>Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Sua senha"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>

            </form>

        </div>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/login.js"></script>

</body>
</html>
