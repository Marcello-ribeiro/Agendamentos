<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/adminstyle.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="shortcut icon" href="../midia/favicon.ico" type="image/x-icon">

    <title>Painel Admin</title>
</head>

<body>

    <header class="admin-header">
        <a href="../../index.html" class="logo">ㄥ乙乙</a>

        <nav>
            <a href="../../index.html">Voltar ao site</a>
            <a href="#" class="sair">Sair</a>
        </nav>
    </header>

    <main class="admin-main">

        <section class="hero-admin">
            <p class="subtitulo">— PAINEL ADMINISTRATIVO —</p>

            <h1>Agendamentos <span>recebidos</span></h1>

            <p class="descricao">
                Veja os horários marcados, confirme sessões e acompanhe os eventos.
            </p>
        </section>

        <section class="resumo">
            <div class="card-resumo">
                <h3>Total</h3>
                <p id="totalAgendamentos">0</p>
            </div>

            <div class="card-resumo">
                <h3>Pendentes</h3>
                <p id="totalPendentes">0</p>
            </div>

            <div class="card-resumo">
                <h3>Confirmados</h3>
                <p id="totalConfirmados">0</p>
            </div>
        </section>

        <section class="filtros">
            <button class="ativo">Pendentes</button>
            <button>Confirmados</button>
            <button>Feitos</button>
            <button>Cancelados</button>
            <button>Recusados</button>
            <button>Todos</button>

        </section>

        <section class="lista-agendamentos"></section>

    </main>

    <!-- MODAL CONFIRMAÇÃO -->
    <div id="confirm-overlay" class="confirm-overlay">
        <div class="confirm-box">

            <p id="confirm-msg"></p>

            <div class="confirm-botoes">
                <button id="confirm-ok">Confirmar</button>
                <button id="confirm-cancel">Cancelar</button>
            </div>

        </div>
    </div>

    <!-- MODAL MOTIVO -->
    <div id="motivo-overlay" class="motivo-overlay">
        <div class="motivo-box">

            <h3>Motivo da recusa/cancelamento</h3>

            <textarea
                id="motivo-texto"
                placeholder="Digite o motivo para o cliente..."
            ></textarea>

            <div class="motivo-botoes">
                <button id="motivo-cancelar">Cancelar</button>
                <button id="motivo-enviar">Continuar</button>
            </div>

        </div>
    </div>

    <!-- MODAL AVALIAÇÃO -->
    <div class="modal-avaliacao" id="modalAvaliacao">
        <div class="box-avaliacao">

            <h2>Avaliar cliente</h2>

            <label for="notaCliente">Nota do cliente</label>
            <select id="notaCliente">
                <option value="">Selecione</option>
                <option value="5">★★★★★</option>
                <option value="4">★★★★☆</option>
                <option value="3">★★★☆☆</option>
                <option value="2">★★☆☆☆</option>
                <option value="1">★☆☆☆☆</option>
            </select>

            <label for="avaliacaoCliente">Comentário</label>
            <textarea
                id="avaliacaoCliente"
                placeholder="Escreva sua avaliação..."
            ></textarea>

            <div class="acoes-avaliacao">
                <button id="cancelarAvaliacao">Cancelar</button>
                <button id="salvarAvaliacao">Salvar avaliação</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../js/admin.js"></script>

</body>
</html>
