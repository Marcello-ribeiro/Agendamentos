<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Cliente</title>

    <link rel="stylesheet" href="../css/logincliente.css">
</head>
<body>

<section class="login-page">

    <div class="login-box">

        <h1>Área do Cliente</h1>

        <p>
            Faça login para acompanhar seus agendamentos e receber confirmações pelo site.
        </p>

        <input type="email" id="email" placeholder="Seu e-mail">

        <input type="password" id="senha" placeholder="Sua senha">

        <button id="entrar">
            Entrar
        </button>

        <button id="criarConta" class="btn-secundario">
            Criar conta
        </button>

        <p id="msg"></p>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/login-cliente.js"></script>

</body>
</html>
